# Checks every push and pull request, so nothing broken reaches main.
# Jobs run in parallel to keep feedback fast.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The web build doesn't need the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: shots/visual/

  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run balance
      - run: npm run replay -- --record shots/ci2-roundtrip.isr --seconds 360 --prelude
      - run: npm run replay -- shots/ci2-roundtrip.isr
      - run: npm run replay -- --record shots/ci2-host.isr --seconds 60 --host --prelude
      - run: npm run replay -- shots/ci2-host.isr
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: balance-replay
          path: shots/
